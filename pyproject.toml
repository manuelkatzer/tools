[project]
name = "las-gt-pipeline"
version = "0.1.0"
description = "Match LAS/LAZ headers against ground truth and tile the hits into COPC"
requires-python = ">=3.10"

# Minimum for 'index' and 'axis': numpy only.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Real CRS transformations. Without pyproj only the naive Gauss-Krueger
# zone shifts are tested (see build_candidates()).
crs = ["pyproj>=3.6"]

# 'process': tiling via las_zu_copc_tiles.py.
# NOTE: the PDAL command-line tool is NOT a Python package and must be
# installed separately (Arch: sudo pacman -S pdal).
process = ["laspy[lazrs]>=2.5", "scipy>=1.11"]

# Only needed when the built-in .gpkg/.shp readers are not enough
# (e.g. non-point geometries). Pulls in GDAL wheels, so it is large.
geo = ["geopandas>=1.0"]

[tool.uv]
# No package build - the scripts are invoked directly via 'uv run'.
package = false

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "W",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "PIE",  # misc
  "PL",   # pylint
  "RUF",
  "S",    # bandit
  "PTH",  # pathlib
  "FURB",
  "N",    # naming
  "ARG",  # unused arguments
  "C4",   # comprehensions
  "TRY",  # exception antipatterns
]
ignore = [
  "S101",    # assert is fine
  "PLR0912", # branch count: CLI dispatchers are inherently branchy
  "PLR0913", # arg count: process_file takes 11 by design
  "PLR0915", # statement count
  "PLR0917", # positional arg count, same reason
  "PLR2004", # magic values: LAS header byte offsets are inherently magic
  "PLC0415", # deferred imports are deliberate - laspy/scipy/pyproj are
  # optional, so `index` must run without them installed
  "PTH123", # open() on an existing Path variable is fine
  "TRY003", # long messages in raise are deliberate here
  "TRY300",
  "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# LAS/LAZ work is byte-offset parsing; URLs come from the user's own list.
"las_gt_pipeline.py" = ["S310", "S608"]
# The pdal CLI is resolved via PATH by design, and /tmp is only a default.
"las_to_copc_tiles.py" = ["S607", "S108"]
