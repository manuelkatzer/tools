[project]
name = "las-gt-pipeline"
version = "0.1.0"
description = "Match LAS/LAZ headers against ground truth and tile the hits into COPC"
requires-python = ">=3.10"

# Minimum for 'index' and 'axis': numpy only.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Real CRS transformations. Without pyproj only the naive Gauss-Krueger
# zone shifts are tested (see build_candidates()).
crs = ["pyproj>=3.6"]

# 'process': tiling via las_zu_copc_tiles.py.
# NOTE: the PDAL command-line tool is NOT a Python package and must be
# installed separately (Arch: sudo pacman -S pdal).
process = ["laspy[lazrs]>=2.5", "scipy>=1.11"]

# Only needed when the built-in .gpkg/.shp readers are not enough
# (e.g. non-point geometries). Pulls in GDAL wheels, so it is large.
geo = ["geopandas>=1.0"]

[tool.uv]
# No package build - the scripts are invoked directly via 'uv run'.
package = false
